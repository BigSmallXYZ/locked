<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Locked">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Locked</title>
<link rel="manifest" href="/phone/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/phone-icon-180.png">
<link rel="icon" href="/assets/phone-icon-192.png" type="image/png">
<link rel="stylesheet" href="/assets/styles.css">
<link rel="stylesheet" href="/assets/phone.css">
<script type="module" src="/assets/phone.js"></script>
</head>
<body>
<!--LOCKED_DATA-->
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </span>
      <span>Locked</span>
    </div>
    <div id="timer" class="timer" role="timer" hidden></div>
  </header>
  <main id="app" class="stack">
    <noscript>
      <section class="card state">
        <h1 class="state-title">Turn on JavaScript</h1>
        <p class="state-body">Locked decrypts credentials on this phone, and that needs JavaScript.</p>
      </section>
    </noscript>
    <section class="card loading" id="loading"><p>Loading…</p></section>
  </main>
  <footer class="footer">
    <p>Credentials only open here after Face ID (or your fingerprint), and they're encrypted until they reach this phone.</p>
  </footer>
</div>
</body>
</html>
